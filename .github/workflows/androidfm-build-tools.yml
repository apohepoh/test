name: Android offline build tools
on:
  push:
    branches: [chatgpt/androidfm-1.2-build-tools-20261022]
    paths: [.github/workflows/androidfm-build-tools.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install public SDK and Gradle
        shell: bash
        run: |
          mkdir -p /tmp/android-bootstrap /tmp/tool-output
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Generate dependency-only bootstrap project
        shell: bash
        run: |
          cd /tmp/android-bootstrap
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'OfflineAndroidToolchain'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
            id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24' apply false
          }
          EOF
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > gradle.properties
          mkdir -p app/src/main/java/org/example/bootstrap app/src/test/java/org/example/bootstrap
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.plugin.serialization'
          }
          android {
            namespace 'org.example.bootstrap'
            compileSdk 34
            defaultConfig { applicationId 'org.example.bootstrap'; minSdk 26; targetSdk 34; versionCode 1; versionName '1' }
            buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
            testOptions { unitTests.includeAndroidResources = true }
            packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
          }
          dependencies {
            implementation platform('androidx.compose:compose-bom:2024.06.00')
            implementation 'androidx.core:core-ktx:1.13.1'
            implementation 'androidx.activity:activity-compose:1.9.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
            implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
            implementation 'androidx.navigation:navigation-compose:2.7.7'
            implementation 'androidx.datastore:datastore-preferences:1.1.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
            implementation 'androidx.media3:media3-exoplayer:1.4.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
            implementation 'androidx.media3:media3-session:1.4.1'
            implementation 'androidx.media3:media3-ui:1.4.1'
            implementation 'io.coil-kt:coil-compose:2.7.0'
            implementation 'io.coil-kt:coil-svg:2.7.0'
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.foundation:foundation'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            debugImplementation 'androidx.compose.ui:ui-tooling'
            debugImplementation 'androidx.compose.ui:ui-test-manifest'
            testImplementation 'junit:junit:4.13.2'
            testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
            testImplementation 'org.robolectric:robolectric:4.13'
            testImplementation 'androidx.test:core:1.6.1'
            testImplementation 'androidx.compose.ui:ui-test-junit4'
            testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Build tooling" /></manifest>
          EOF
          cat > app/src/main/java/org/example/bootstrap/Bootstrap.kt <<'EOF'
          package org.example.bootstrap
          import androidx.compose.runtime.Composable
          import androidx.compose.material3.Text
          import kotlinx.serialization.Serializable
          @Serializable data class Example(val name: String)
          @Composable fun ExampleView() { Text("Build tooling") }
          EOF
          cat > app/src/test/java/org/example/bootstrap/BootstrapTest.java <<'EOF'
          package org.example.bootstrap;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.annotation.Config;
          import org.robolectric.annotation.GraphicsMode;
          import static org.junit.Assert.*;
          @RunWith(RobolectricTestRunner.class)
          @Config(sdk = {26,31,34})
          @GraphicsMode(GraphicsMode.Mode.NATIVE)
          public class BootstrapTest {
            @Test public void warmPlatform() {
              android.graphics.Bitmap b = android.graphics.Bitmap.createBitmap(8,8,android.graphics.Bitmap.Config.ARGB_8888);
              assertEquals(8,b.getWidth()); b.recycle();
            }
          }
          EOF
      - name: Resolve compile, shrink, lint and test dependencies
        shell: bash
        run: |
          cd /tmp/android-bootstrap
          /tmp/gradle-8.7/bin/gradle --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug 2>&1 | tee /tmp/tool-output/bootstrap.log
      - name: Package public tooling only
        if: always()
        shell: bash
        run: |
          /tmp/gradle-8.7/bin/gradle --stop || true
          tar -C /tmp -czf /tmp/tool-output/gradle-8.7.tgz gradle-8.7
          tar -C "$ANDROID_HOME" -czf /tmp/tool-output/android-sdk-34.tgz platforms/android-34 build-tools/34.0.0 licenses
          tar --exclude='*.lock' --exclude='*.lck' -C "$HOME/.gradle" -czf /tmp/tool-output/gradle-caches.tgz caches
          if [ -d "$HOME/.m2/repository/org/robolectric" ]; then tar -C "$HOME/.m2" -czf /tmp/tool-output/robolectric-platforms.tgz repository/org/robolectric; fi
          cd /tmp/tool-output && sha256sum *.tgz > SHA256SUMS.txt
          ls -lh /tmp/tool-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-tools
          path: /tmp/tool-output
          compression-level: 0
          retention-days: 3
