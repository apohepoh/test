name: Android offline build tools
on:
  push:
    branches: [chatgpt/androidfm-1.2-build-tools-20261022]
    paths: [.github/workflows/androidfm-build-tools.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare public toolchain
        shell: bash
        run: |
          mkdir -p /tmp/android-bootstrap /tmp/tool-output
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
          curl -fL --retry 3 'https://raw.githubusercontent.com/apohepoh/test/306f26ffc48d4431d5a6488414a2ae40137cc6ad/.github/workflows/androidfm-build-tools.yml' -o /tmp/bootstrap.yml
          python3 - <<'PY'
          import yaml, pathlib
          workflow = yaml.safe_load(pathlib.Path('/tmp/bootstrap.yml').read_text())
          for step in workflow['jobs']['toolchain']['steps']:
              if step.get('name') == 'Generate dependency-only bootstrap project':
                  pathlib.Path('/tmp/generate.sh').write_text(step['run'])
          PY
          bash /tmp/generate.sh
      - name: Resolve dependencies and test platforms
        shell: bash
        run: |
          cd /tmp/android-bootstrap
          /tmp/gradle-8.7/bin/gradle --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug 2>&1 | tee /tmp/tool-output/bootstrap.log
      - name: Package caches
        if: always()
        shell: bash
        run: |
          /tmp/gradle-8.7/bin/gradle --stop || true
          tar --exclude='*.lock' --exclude='*.lck' -C "$HOME/.gradle" -czf /tmp/tool-output/gradle-caches.tgz caches
          if [ -d "$HOME/.m2/repository/org/robolectric" ]; then tar -C "$HOME/.m2" -czf /tmp/tool-output/robolectric-platforms.tgz repository/org/robolectric; fi
          cd /tmp/tool-output && sha256sum *.tgz > SHA256SUMS.txt
          ls -lh /tmp/tool-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-caches
          path: /tmp/tool-output
          compression-level: 0
          retention-days: 3
